<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact - Cyberbullying Detection System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#13b7ef;
  --accent:#ff4081;
  --bg-dark:#0d0f1a;
  --bg-light:#f5f5f5;
  --text-dark:#e6edef;
  --text-light:#222;
}
body {
  margin:0;
  font-family:'Roboto',sans-serif;
  background: var(--bg-dark);
  color: var(--text-dark);
  transition: all 0.3s ease;
}
body.light {
  background: var(--bg-light);
  color: var(--text-light);
}

/* Navbar */
.navbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:#111;
  position: sticky;
  top:0;
  z-index:1000;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
  transition:all 0.3s;
}
body.light .navbar { background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.logo-combo { display:flex; align-items:center; gap:10px;}
.logo {
  background: var(--primary);
  color:#fff;
  font-weight:700;
  font-size:22px;
  width:42px;
  height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:10px;
  box-shadow:0 0 15px var(--primary);
}
.sys-title { font-weight:600; font-size:1.1rem; color:inherit;}
.nav-links { display:flex; gap:15px; align-items:center;}
.nav-links a {
  text-decoration:none;
  color:inherit;
  padding:6px 14px;
  border-radius:6px;
  transition:0.3s;
  position:relative;
}
.nav-links a::after {
  content:'';
  position:absolute;
  width:0;
  height:2px;
  left:0; bottom:0;
  background: var(--accent);
  transition:0.3s;
}
.nav-links a:hover::after { width:100%; }
.nav-links a.active { color:#fff; background:var(--primary); box-shadow:0 0 10px var(--primary);}
.toggle-btn {
  background:transparent;
  border:none;
  color: var(--primary);
  font-size:1.3rem;
  cursor:pointer;
  transition:0.3s;
}
body.light .toggle-btn { color: var(--accent); }

/* Main Container */
.container {
  max-width:900px;
  margin:90px auto 50px auto;
  background: rgba(255,255,255,0.05);
  padding:36px 30px;
  border-radius:16px;
  backdrop-filter: blur(10px);
  box-shadow:0 0 30px rgba(19,183,239,0.2);
  transition:all 0.3s;
}
body.light .container { background:#fff; box-shadow:0 0 20px rgba(0,0,0,0.1);}
h1 { text-align:center; margin-bottom:20px; font-weight:700; text-shadow:0 0 5px var(--primary);}
p { text-align:center; margin-bottom:30px; color:inherit; }

/* Contact Info Row */
.contact-row {
  display:flex;
  flex-wrap:wrap;
  justify-content:space-around;
  gap:20px;
  margin-bottom:30px;
}
.contact-item {
  flex:1 1 200px;
  background: rgba(255,255,255,0.05);
  padding:20px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 20px rgba(19,183,239,0.2);
  transition:0.3s;
}
body.light .contact-item { background:#f1f1f1; box-shadow:0 0 10px rgba(0,0,0,0.1);}
.contact-item strong { display:block; margin-bottom:8px; color:var(--primary); }

/* Contact Form */
.contact-form {
  display:flex;
  flex-direction:column;
  gap:14px;
}
.contact-form label { font-weight:600; margin-bottom:4px; }
.contact-form input, .contact-form textarea {
  padding:12px;
  border-radius:8px;
  border:2px solid rgba(255,255,255,0.2);
  background:none;
  color:inherit;
  font-size:1rem;
  transition:0.3s;
}
body.light .contact-form input, body.light .contact-form textarea { border:2px solid #ccc; color:#222; }
.contact-form input:focus, .contact-form textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 10px var(--accent);}
.contact-form textarea { resize: vertical; min-height:100px; }
.btn {
  padding:12px;
  font-weight:600;
  border:none;
  border-radius:10px;
  background: linear-gradient(90deg,#13b7ef,#ff4081);
  color:#fff;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 15px rgba(19,183,239,0.3);
}
.btn:hover { box-shadow:0 0 25px rgba(255,64,129,0.5); }

@media(max-width:768px){
  .contact-row { flex-direction:column; align-items:center; }
  .navbar{flex-direction:column;align-items:flex-start;gap:10px;}
  .nav-links{flex-direction:column; gap:5px;}
}
</style>
</head>
<body>
<header class="navbar">
  <div class="logo-combo">
    <div class="logo">CB</div>
    <div class="sys-title">Cyberbullying Detection System</div>
  </div>
  <div class="nav-links">
    <a href="{{ url_for('index') }}">Manual Detection</a>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('contact') }}" class="active">Contact</a>
  </div>
  <button class="toggle-btn" onclick="toggleDark()">&#9788;</button>
</header>

<main>
<div class="container">
  <h1>Contact Us</h1>
  <p>Have questions or feedback? We'd love to hear from you.</p>

  <div class="contact-row">
    <div class="contact-item">
      <strong>Email</strong>
      support@cbdetection.com
    </div>
    <div class="contact-item">
      <strong>Phone</strong>
      +91 (022) 122 3004
 </div>
    <div class="contact-item">
      <strong>Address</strong>
      123 Tech Street, Digital City, DC 12345
    </div>
  </div>

  <form class="contact-form" onsubmit="event.preventDefault(); alert('Message Sent!'); this.reset();">
    <label>Name</label>
    <input type="text" placeholder="Your name" required />
    <label>Email</label>
    <input type="email" placeholder="your.email@example.com" required />
    <label>Subject</label>
    <input type="text" placeholder="What is this regarding?" required />
    <label>Message</label>
    <textarea placeholder="Your message..." required></textarea>
    <button type="submit" class="btn">Send Message</button>
  </form>
</div>
</main>

<script>
function toggleDark(){
  document.body.classList.toggle('light');
  localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');
}
if(localStorage.getItem('theme')==='light') document.body.classList.add('light');
</script>
</body>
</html>
